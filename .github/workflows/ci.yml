name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Bundle
        run: bun run bundle

      - name: dist/ is committed and current
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date: run bun run bundle and commit"
            exit 1
          fi

      - name: install.sh parses
        if: matrix.os == 'ubuntu-latest'
        run: bash -n install.sh

      - name: install.sh smoke test
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -eu
          S=$(mktemp -d)
          export HOME="$S"
          export XDG_CONFIG_HOME="$S/cfg"
          CLI="$S/cfg/opencode/cli.json"

          bash install.sh --ref "${{ github.sha }}" --dir "$S/od"
          INSTALLED=$(cd "$S/od" && pwd -P)
          cat "$CLI"
          COUNT=$(grep -cF "\"$INSTALLED\"" "$CLI" || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::expected exactly one plugin entry after install, got $COUNT"
            exit 1
          fi

          bash install.sh --ref "${{ github.sha }}" --dir "$S/od"
          cat "$CLI"
          COUNT=$(grep -cF "\"$INSTALLED\"" "$CLI" || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::install is not idempotent: $COUNT entries after second run"
            exit 1
          fi

          bash install.sh --uninstall --yes --dir "$S/od"
          cat "$CLI"
          COUNT=$(grep -cF "\"$INSTALLED\"" "$CLI" || true)
          if [ "$COUNT" -ne 0 ]; then
            echo "::error::uninstall left $COUNT entries behind"
            exit 1
          fi

      - name: install.ps1 smoke test (PowerShell 7 and Windows PowerShell 5.1)
        if: matrix.os == 'windows-latest' && github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($exe in @("pwsh", "powershell")) {
            $root = Join-Path $env:RUNNER_TEMP "od-$exe"
            New-Item -ItemType Directory -Force -Path "$root\cfg\opencode" | Out-Null
            $env:XDG_CONFIG_HOME = "$root\cfg"
            $cli = "$root\cfg\opencode\cli.json"
            # an existing config with another plugin and key must survive
            '{"theme":"x","plugins":["some-other-plugin"]}' | Set-Content -Encoding ascii $cli
            $dir = "$root\od"
            $repo = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
            & $exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Dir $dir -Ref $env:GITHUB_SHA -Repo $repo
            if ($LASTEXITCODE) { throw "$exe install failed" }
            & $exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Dir $dir -Ref $env:GITHUB_SHA -Repo $repo
            if ($LASTEXITCODE) { throw "$exe re-install failed" }
            $data = Get-Content -Raw $cli | ConvertFrom-Json
            Write-Host ($data | ConvertTo-Json -Depth 5)
            $ours = @($data.plugins | Where-Object { $_ -is [string] -and $_ -like "*od" })
            if ($ours.Count -ne 1) { throw "$exe expected one opendeck entry, got $($ours.Count)" }
            if (-not ($data.plugins -contains "some-other-plugin")) { throw "$exe dropped another plugin" }
            if ($data.theme -ne "x") { throw "$exe dropped another key" }
            if (-not (Test-Path (Join-Path $ours[0] "tui.js"))) { throw "$exe registered path has no tui.js: $($ours[0])" }
            if (-not (Test-Path (Join-Path $ours[0] "dist\index.js"))) { throw "$exe install has no dist/index.js" }
            & $exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Dir $dir -Uninstall -Yes
            if ($LASTEXITCODE) { throw "$exe uninstall failed" }
            $data = Get-Content -Raw $cli | ConvertFrom-Json
            if (@($data.plugins | Where-Object { $_ -like "*od" }).Count -ne 0) { throw "$exe uninstall left the entry" }
            if (Test-Path $dir) { throw "$exe uninstall left $dir" }
            Write-Host "$exe OK"
          }

      - name: install.ps1 via 'irm | iex' style (script block, default params)
        if: matrix.os == 'windows-latest' && github.event_name == 'push'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "od-iex"
          $env:XDG_CONFIG_HOME = "$root\cfg"
          $env:LOCALAPPDATA = "$root\appdata"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          # same as `irm <raw url> | iex`, but with this commit's script
          Get-Content -Raw install.ps1 | Invoke-Expression
          $cli = "$root\cfg\opencode\cli.json"
          $data = Get-Content -Raw $cli | ConvertFrom-Json
          Write-Host ($data | ConvertTo-Json -Depth 5)
          $p = @($data.plugins)[0]
          if (-not (Test-Path (Join-Path $p "tui.js"))) { throw "iex install did not register a valid dir: $p" }
          Write-Host "iex OK"

      - name: install.ps1 parses
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
            exit 1
          }
